<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3DGS Viewer</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="toolbar">
        <h1 id="app-title">3DGS Viewer</h1>
        <label class="btn">
          <span id="btn-open-ply-label">Open PLY</span>
          <input id="file-input" type="file" accept=".ply,.splat" hidden />
        </label>
        <button id="btn-load-url" type="button" class="btn secondary">Load from URL</button>
        <span id="status" class="status"></span>
        <button id="btn-lang" type="button" class="btn lang-toggle" title="Switch language">中文</button>
      </header>
      <div id="canvas-host"></div>
      <aside id="help" class="help">
        <p><strong id="help-title">Usage</strong></p>
        <ul>
          <li id="help-drop">Drop avatar.ply exported from LHM++ / HRM</li>
          <li id="help-controls">Left drag: rotate · Right drag: pan · Wheel: zoom</li>
        </ul>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
